# Excerpts from configs/settings.yml as generated by
# Stirling PDF v3.2.1 on first start (the login build's copy).
# The full file runs to hundreds of lines; these are the
# passages chapters 11 and 12 quote. Values and comments are
# the file's own. The file's header warns, in its own words,
# "Do not comment out any entry, it will be removed on next
# startup," and gives the environment-override pattern:
# the settings path in capitals, e.g.
# SECURITY_INITIALLOGIN_USERNAME.

# --- who may use the tools (chapter 11) -------------------
security:
  enableLogin: true # set to 'true' to enable login
  loginAttemptCount: 5 # lock user account after 5 tries
  loginResetTimeMinutes: 120 # lock account for 2 hours
  initialLogin:
    username: "" # initial username for the first login
    password: "" # initial password for the first login

# --- the welcome mat and the analytics (chapters 11, 12) --
system:
  defaultLocale: "" # force a default language for new users
  googlevisibility: false # 'true' serves an allow-all
    # /robots.txt; 'false' serves a disallow-all /robots.txt
    # to keep the instance out of search engines
  enableAnalytics: null # set to 'false' to disable all
    # analytics, or leave as 'null' to prompt admin on
    # first launch

# --- what the page calls itself (chapter 12) --------------
ui:
  appName: "Stirling PDF" # application's visible name
  appNameNavbar: "Stirling PDF"

# --- retiring whole families of tools (chapter 12) --------
endpoints:
  toRemove: [] # list of endpoints to remove
    # (e.g. ['img-to-pdf', 'remove-pages'])
  groupsToRemove: [] # list of groups to remove
    # (e.g. ['LibreOffice'])
