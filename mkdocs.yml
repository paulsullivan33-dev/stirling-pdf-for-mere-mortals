site_name: Stirling PDF for Mere Mortals
site_description: Plain-language self-hosted PDF work on your own machine. Merge, split, rotate, convert and rescue documents in a browser tab or from a script, with the files never leaving your network. Installing the jar, the everyday tools, the API, security habits and honest limits.
